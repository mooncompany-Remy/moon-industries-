<!DOCTYPE html>
<html>
<head>
<title>Contact Moon Industries</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    background:#050505;
    color:white;
    padding:40px;
}

h1 {
    font-size:45px;
}

.card {
    background:#111;
    padding:30px;
    margin-top:30px;
    border-radius:15px;
}

input, textarea {
    width:100%;
    padding:15px;
    margin:10px 0;
    background:#222;
    border:none;
    color:white;
}

button {
    padding:15px 30px;
    border:none;
    cursor:pointer;
    font-weight:bold;
}
</style>

</head>

<body>

<h1>Contact Moon Industries</h1>

<div class="card">

<p>
Have an idea, partnership, or question?
Contact us.
</p>

<input placeholder="Your Name">

<input placeholder="Your Email">

<textarea placeholder="Your Message"></textarea>

<button>Send Message</button>

</div>

</body>
</html>
